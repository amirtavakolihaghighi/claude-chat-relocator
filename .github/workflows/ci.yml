name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  smoke:
    name: server starts and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Boot the server and check the API answers
        env:
          NO_OPEN: '1'
          PORT: '4317'
        run: |
          node server/index.js &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4317/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4317/api/health
          curl -sf http://127.0.0.1:4317/ > /dev/null
          curl -sf http://127.0.0.1:4317/app.js > /dev/null
          curl -sf http://127.0.0.1:4317/transcript.css > /dev/null
          kill %1
